# Asystent formalny (RAG na lokalnym korpusie).
#
# Przebieg (szczegóły: backend/src/kompas_mc/asystent.py):
#   0. artykuł ustawy wskazany w pytaniu ⇒ cytaty z tego artykułu; bez ustawy w korpusie pytanie
#      o ustawę (`wzorzec_pytania_o_ustawe`) ⇒ „brak informacji” z komunikatem `brak_ustawy`,
#   1. przygotowany zestaw pytań i odpowiedzi (faq.yaml) w ramach ścieżki,
#   2. pojęcia pytania nieobecne w korpusie i w FAQ ⇒ „brak informacji” z ich nazwą,
#   3. ranking BM25 na rdzeniach skróconych do `dlugosc_rdzenia`, z wagą dokumentu;
#      poza FAQ najlepszy fragment musi mieć `minimalny_wynik` i `minimalne_pokrycie`,
#   4. fragmenty idą przez łańcuch LlmProvider (walidacja cytatów w core).

wersja: "asystent-mc-2"
cytaty: 3               # ile fragmentów trafia do odpowiedzi
komunikat_brak: brak wystarczających informacji w bazie wiedzy
faq: faq.yaml           # względem tego pliku

dlugosc_rdzenia: 5      # „warunki”/„warunkiem” → ten sam prefiks (stemmer core daje różne rdzenie)
minimalny_wynik: 4.0    # wynik najlepszego fragmentu (po wagach), poniżej ⇒ „brak informacji”
# Udział pojęć pytania (po słowniku) obecnych w najlepszym fragmencie; tylko poza FAQ, poniżej ⇒ „brak”.
# Pomiar 22.11: parafrazy z bazy poza FAQ 0,50–0,86; „Jak zgłosić wypadek przy pracy?” 0,33.
minimalne_pokrycie: 0.5
prog_faq: 0.35          # podobieństwo pytania do pozycji FAQ (kosinus ważony idf, 0–1)
udzial_nieznanych: 0.0  # 0.0 = każde pojęcie spoza korpusu i FAQ blokuje odpowiedź

# Waga dokumentu w rankingu: przepis przed objaśnieniem. Domyślna wg kategorii z korpus.yaml.
wagi_kategorii:
  PRZEPIS: 1.0
  OBJAŚNIENIE_MATERIAŁU: 0.8
wagi_dokumentow:
  model-kompetencji: 0.9
  arkusz-pierwszej: 0.6
  arkusz-b: 0.6
  arkusz-c: 0.6
  osp-starszy-specjalista: 0.4
  osp-radca: 0.4
  osp-naczelnik: 0.4

# Słowa pytające i ogólne czasowniki – nie niosą treści i nie są „nieznanym pojęciem”.
slowa_pomijane: >-
  jak jaki jaka jakie jakim jakiej kiedy czy co ile kto kogo komu gdzie dlaczego po co czym
  mój moja moje mojego mojemu mam masz ma mamy mogę może można muszę musi trzeba należy
  w we z ze do na o od po za i a się jest są był była było byli dla przy przez pod nad
  który która które którego to ten ta te tego tej tym mi mnie jeśli jeżeli gdy oraz lub albo
  nie tak by być ale już jeszcze więc też tylko jeden jedna jedno
  dostać dostanie pisać napisać zrobić robić wnieść wyszła wyszło wyszedł oceniłam oceniłem
  miałam miałem miała miał chcę chciałabym chciałbym proszę powiedz wyjaśnij

# Słownik: wyrażenie potoczne → słowa z przepisów, dopisywane do zapytania. Dopasowanie
# całych słów, dłuższe wyrażenie wygrywa. Wyrażenie ze słownika nie jest „nieznanym pojęciem”.
slownik:
  zwolnienie lekarskie: usprawiedliwiona nieobecność
  zwolnieniu lekarskim: usprawiedliwioną nieobecnością
  chorobowe: usprawiedliwiona nieobecność
  przesunąć termin: nowy termin przedłużając
  podwładnych: kierowaniu pracownikami
  podwładnymi: kierowaniu pracownikami
  kieruje zespołem: bezpośrednim kierowaniu pracownikami
  kierownik zespołu: bezpośrednim kierowaniu pracownikami
  szef: bezpośredni przełożony oceniający
  szefowa: bezpośredni przełożony oceniający
  nie zgadza się: sprzeciw
  odwołać się: sprzeciw
  odwołanie: sprzeciw
  przysługuje: służy        # art. 83 ust. 1 ustawy: „Od oceny okresowej służy … sprzeciw”
  skala: punkty
  awans: kolejnego stopnia służbowego
  nowy pracownik: nawiązania stosunku pracy pierwszej oceny
  # Pytania o czas: słowo pytające jest pomijane, więc intencję „termin” dopisuje słownik.
  kiedy: termin
  ile dni: termin dni
  ile czasu: termin
  w jakim czasie: termin
  jak długo: okres
  # Próba jury (#53): potoczne słowa o prowadzeniu rozmowy, których nie ma w materiałach.
  zdenerwowany: emocje
  zdenerwowana: emocje
  poprowadzić: rozmowa
  rozmawiać: rozmowa
  zadać: pytania
  # Potoczne słowa z audytu jak u jury (#53): nie są „nieznanym pojęciem”, dopisują słowa z materiałów.
  najwcześniej: nie wcześniej niż termin
  najpóźniej: nie później niż termin
  grozi: czeka skutki
  grożą: czeka skutki
  konsekwencje: czeka skutki
  kto podlega: obligatoryjnie podlega osoba
  przekazać ocenę: informacja zwrotna rozmowa oceniająca
  przekazywać ocenę: informacja zwrotna rozmowa oceniająca
  przekazanie oceny: informacja zwrotna rozmowa oceniająca
  powiedzieć o ocenie: informacja zwrotna rozmowa oceniająca

# Odwołanie do przepisu ustawy: we fragmencie objaśnienia (flaga „powołuje ustawę”) i w pytaniu
# (wskazany artykuł idzie na początek cytatów).
wzorzec_ustawy: 'art\.\s*\d+[a-z]*(?:\s*ust\.\s*\d+)?\s*(?:ustawy|u\.s\.c)'
# doc_id tekstu ustawy w korpus.yaml. Gdy go nie ma w korpusie, pytanie o ustawę (wzorzec niżej:
# całe formy rzeczownika, nie „ustaw”, bo to też „ustawić”, i skrót u.s.c.) dostaje odmowę
# `brak_ustawy` przed wyszukiwaniem, zamiast cytatu z rozporządzenia.
ustawa: ustawa-sc
# Najwyżej tyle fragmentów ustawy z rankingu w jednej odpowiedzi (artykuł wskazany w pytaniu bez
# limitu). Ustawa (541 fragmentów) dotyczy głównie naboru, mianowania i dyscypliny, więc bez limitu
# wypierała rozporządzenia i poradniki. Pomiar 22.11, waga ustawy 1,0, tryb ekstrakcyjny:
# bez limitu parafrazy 13/22, limit 1: 16/22, limit 2: 14/22; kontrolne 22/22 w każdym wariancie.
ustawa_maks_z_rankingu: 1
wzorzec_pytania_o_ustawe: '\bustaw(?:a|y|ie|ę|ą)\b|\bu\.\s*s\.\s*c\b'

komunikaty:
  nieznane_pojecie: 'W materiałach nie znaleziono słowa z pytania: {pojecia}.'
  nieznane_pojecia: 'W materiałach nie znaleziono słów z pytania: {pojecia}.'
  brak_ustawy: Tekstu ustawy o służbie cywilnej nie ma w bazie wiedzy, więc asystent nie cytuje jej przepisów – sprawdź w ustawie.
  ustawa: Fragment poradnika lub arkusza powołuje przepis ustawy o służbie cywilnej; jej tekst jednolity (Dz.U. 2026 poz. 590) jest w bazie wiedzy – zapytaj o wskazany artykuł, np. „art. 83 ustawy”.
  sugestia: Asystent wskazuje fragmenty źródeł; nie podejmuje decyzji o ocenie.
  faq: Odpowiedź z przygotowanego zestawu pytań i odpowiedzi; podstawą jest cytowany fragment źródła.

llm:
  dostawcy:
    # DeepSeek v4 Flash hostowany w Scaleway Generative APIs (UE, Paryż), nie bezpośrednio u dostawcy (Karol 22.11).
    - typ: openai_zgodny
      base_url: https://api.scaleway.ai/v1
      model: deepseek-v4-flash-0731
      zmienna_klucza: SCALEWAY_API_KEY
      # Klucz z uprawnieniami do jednego projektu wymaga adresu https://api.scaleway.ai/<projekt>/v1 (ustaw na serwerze).
      zmienna_adresu: SCALEWAY_BASE_URL
      timeout: 30
      temperatura: 0.0
    - {typ: ollama, model: "qwen3:8b", timeout: 5}
    - {typ: ekstrakcyjny, k: 3}   # k ≥ cytaty

reguly:
  - id: asystent.brak-informacji
    opis: >-
      Gdy pytanie wskazuje ustawę, a dokumentu `ustawa` nie ma w korpusie, asystent odpowiada
      komunikatem `komunikat_brak` i uwagą `brak_ustawy`. Gdy pytanie nie pasuje do przygotowanego zestawu pytań i zawiera pojęcie,
      którego nie ma w korpusie ani w FAQ, albo najlepszy fragment ma wynik poniżej
      `minimalny_wynik` lub pokrycie pytania poniżej `minimalne_pokrycie`, asystent odpowiada
      komunikatem `komunikat_brak` i nazywa brakujące pojęcia.
    adnotacje:
      - kategoria: DECYZJA_PROJEKTOWA
        uzasadnienie: >-
          Zadanie wymaga, by asystent odpowiadał tylko z bazy wiedzy. Pomiar pokazał, że ani wynik
          BM25, ani pokrycie słów nie rozdzielają pytań z bazy i spoza bazy; pojęcie spoza
          korpusu rozdziela je na zestawie kontrolnym (6/6) i parafrazach (4/5).
        zatwierdził: osoba D

  - id: asystent.przepis-przed-objasnieniem
    opis: >-
      Wynik fragmentu jest mnożony przez wagę dokumentu: przepisy (rozporządzenia, ustawa) 1.0, model 0.9,
      poradniki 0.8, arkusze 0.6, OSP 0.4.
    adnotacje:
      - kategoria: DECYZJA_PROJEKTOWA
        uzasadnienie: Przepis jest podstawą, a poradnik go objaśnia.
        zatwierdził: osoba A

  - id: asystent.przygotowany-zestaw-pytan
    opis: >-
      Pytanie podobne (≥ `prog_faq`) do pozycji faq.yaml dla tej ścieżki dostaje odpowiedź
      napisaną przez człowieka i cytat źródła tej pozycji; dalsze cytaty z rankingu.
    adnotacje:
      - kategoria: DECYZJA_PROJEKTOWA
        uzasadnienie: >-
          Treść zadania (pkt 5) wymienia „przygotowany zestaw pytań i odpowiedzi” jako część
          bazy wiedzy. Samo wyszukiwanie: 14/22 pytań kontrolnych; z FAQ: 22/22, parafrazy
          15/22 (parafrazy napisane przed FAQ, nie służą do strojenia).
        zatwierdził: osoba D

  - id: kontrola.rozmowa-wstepna
    opis: >-
      Pytanie kontrolne: „Kiedy przeprowadza się rozmowę wstępną?” – oczekiwany cytat.
    adnotacje:
      - kategoria: PRZEPIS
        doc_id: rozp-2015-pierwsza
        lokalizator: § 3
        strona: 1
        cytat_dosłowny: >-
          W terminie 21 dni od dnia nawiązania z ocenianym stosunku pracy
      - kategoria: PRZEPIS
        doc_id: rozp-2015-pierwsza
        lokalizator: § 3
        strona: 1
        cytat_dosłowny: bezpośredni przełożony przeprowadza z ocenianym rozmowę wstępną
