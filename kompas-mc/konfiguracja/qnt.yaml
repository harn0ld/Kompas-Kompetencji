# FIKCYJNI pracownicy do mocka systemu kadrowego QNT (wersja MC, #28).
# Wszystkie osoby i daty są wymyślone. Brak PESEL, adresów i danych wrażliwych
# (zasada minimalizacji danych z treści zadania, pkt 5).
# Stanowiska i komórki pochodzą z 3 opisów stanowisk w „materialy mc/OSP_word”.
# Oceny cząstkowe ostatniej oceny (#33) są fikcyjne i zgodne z wynikiem: negatywna = któreś kryterium 1 albo średnia < 4.
# „Dziś” demo = 2026-11-21. Każdy rekord ma `scenariusz`: co ma pokazać na demo.
# Arkusz (A/B/C) NIE jest polem danych – wylicza go reguła z § 3 rozp. 2016
# na podstawie `kieruje_pracownikami`; podany niżej tylko jako oczekiwany wynik testu.

