# Przygotowany zestaw pytań i odpowiedzi (#37) – część bazy wiedzy asystenta formalnego.
# Treść zadania MC BDG, pkt 5: baza wiedzy obejmuje „przygotowany zestaw pytań i odpowiedzi”.
#
# Każda pozycja: warianty pytania, krótka odpowiedź napisana przez człowieka i źródło
# (SourceRef z dosłownym cytatem, sprawdzanym przez kompas-waliduj). Asystent pokazuje
# odpowiedź RAZEM z cytatem; bez cytatu pozycja nie przechodzi walidacji.
#
# ZASADA TESTU: warianty pytań NIE kopiują sformułowań z pytania-kontrolne.yaml ani
# pytania-parafrazy.yaml – oba pliki są zestawami testowymi.
#
# Status: DECYZJA_PROJEKTOWA do zatwierdzenia przez A (#37). Autor: D.

wersja: 1

pozycje:
  # ======================= PIERWSZA OCENA (rozp. 2015) =======================
  - id: FAQ-P01
    sciezka: pierwsza
    pytania:
      - termin rozmowy wstępnej w pierwszej ocenie
      - do ilu dni od zatrudnienia przeprowadza się rozmowę wstępną
      - kiedy najpóźniej spotkać się z nowo przyjętą osobą na rozmowę wstępną
      - do kiedy rozmowa wstępna z nową osobą
    odpowiedz: W ciągu 21 dni od nawiązania stosunku pracy (przy zastępstwie – od ustalenia, że osoba podlega pierwszej ocenie).
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 3", strona: 1,
         cytat_dosłowny: "W terminie 21 dni od dnia nawiązania z ocenianym stosunku pracy"}

  - id: FAQ-P02
    sciezka: pierwsza
    pytania:
      - zakres rozmowy wstępnej
      - co przełożony robi na rozmowie wstępnej
      - jakie tematy porusza się na początku pierwszej oceny
    odpowiedz: Przełożony zapoznaje ze sposobem dokonywania oceny, omawia obowiązki z opisu stanowiska i oczekiwania (postawa, zaangażowanie, relacje, terminowość) oraz wyznacza termin złożenia sprawozdania.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 3 pkt 1–4", strona: 1,
         cytat_dosłowny: "zapoznaje ocenianego ze sposobem dokonywania pierwszej oceny"}

  - id: FAQ-P03
    sciezka: pierwsza
    pytania:
      - jak ustalić datę złożenia sprawozdania
      - termin na sprawozdanie a 8 miesięcy od zatrudnienia
      - na kiedy wyznaczyć sprawozdanie
    odpowiedz: Termin ustala się tak, aby przypadał po upływie 8 miesięcy od nawiązania stosunku pracy i aby ocenę można było dokonać w terminie z art. 38 ust. 1 ustawy.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 4 ust. 1", strona: 2,
         cytat_dosłowny: "przypadał on po upływie 8 miesięcy od dnia nawiązania z ocenianym stosunku pracy"}

  - id: FAQ-P04
    sciezka: pierwsza
    pytania:
      - co wpisuje się do arkusza po rozmowie wstępnej
      - jakie daty trzeba zanotować w arkuszu pierwszej oceny na starcie
    odpowiedz: Termin rozmowy wstępnej, termin złożenia sprawozdania i okres, w którym ma być dokonana pierwsza ocena.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 4 ust. 2", strona: 2,
         cytat_dosłowny: "terminie wyznaczonym na złożenie sprawozdania"}

  - id: FAQ-P05
    sciezka: pierwsza
    pytania:
      - nieobecność usprawiedliwiona a termin sprawozdania
      - czy L4 lub delegacja przedłuża termin złożenia sprawozdania
      - nowy termin sprawozdania po absencji
    odpowiedz: Tak. Przełożony wyznacza nowy termin, przedłużając dotychczasowy o okres usprawiedliwionej nieobecności lub pracy poza miejscem pracy, i niezwłocznie zawiadamia pisemnie (§ 5 ust. 4).
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 5 ust. 1", strona: 2,
         cytat_dosłowny: "przedłużając dotychczasowy termin o okres tej nieobecności"}

  - id: FAQ-P06
    sciezka: pierwsza
    pytania:
      - minimalny okres objęty sprawozdaniem
      - jak długi okres obejmuje sprawozdanie do pierwszej oceny
    odpowiedz: Co najmniej 7 miesięcy przepracowanego okresu.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 6 ust. 1", strona: 2,
         cytat_dosłowny: "Sprawozdanie obejmuje przepracowany przez ocenianego okres nie krótszy niż 7 miesięcy."}

  - id: FAQ-P07
    sciezka: pierwsza
    pytania:
      - co zawiera sprawozdanie ocenianego
      - co pracownik opisuje w sprawozdaniu
    odpowiedz: Zadania z opisu stanowiska i inne istotne zadania, napotkane problemy i sposób ich rozwiązania, zdobyte umiejętności i wiedzę oraz wnioski usprawniające.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 6 ust. 2", strona: 2,
         cytat_dosłowny: "problemy, z którymi spotkał się przy wykonywaniu zadań, i sposób ich rozwiązania"}

  - id: FAQ-P08
    sciezka: pierwsza
    pytania:
      - lista elementów oceny w pierwszej ocenie
      - co podlega ocenie przy pierwszej ocenie w służbie cywilnej
      - kompetencje brane pod uwagę w pierwszej ocenie
    odpowiedz: Rzetelność; wykorzystywanie wiedzy i doskonalenie zawodowe; organizacja pracy i orientacja na osiąganie celów; komunikacja; współpraca – a także wynik egzaminu ze służby przygotowawczej (jeśli obowiązywał) i sprawozdanie.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 2 pkt 1", strona: 1,
         cytat_dosłowny: "wykorzystywanie wiedzy i doskonalenie zawodowe"}

  - id: FAQ-P09
    sciezka: pierwsza
    pytania:
      - na czym polega dokonanie pierwszej oceny
      - etapy dokonania pierwszej oceny
    odpowiedz: Rozmowa oceniająca, oceny cząstkowe za elementy oceny, ocena łączna jako średnia arytmetyczna i przyznanie oceny pozytywnej lub negatywnej.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 7", strona: 2,
         cytat_dosłowny: "ustaleniu oceny łącznej, będącej średnią arytmetyczną z ocen cząstkowych"}

  - id: FAQ-P10
    sciezka: pierwsza
    pytania:
      - punktacja ocen cząstkowych w pierwszej ocenie
      - 3 5 7 punktów co oznaczają
    odpowiedz: 3 pkt – poniżej oczekiwań, 5 pkt – na poziomie oczekiwań, 7 pkt – powyżej oczekiwań.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 9 ust. 1", strona: 3,
         cytat_dosłowny: "3 punkty – poniżej oczekiwań"}

  - id: FAQ-P11
    sciezka: pierwsza
    pytania:
      - kiedy odbywa się rozmowa oceniająca w pierwszej ocenie
      - po złożeniu sprawozdania co dalej
    odpowiedz: Niezwłocznie po złożeniu sprawozdania albo po upływie terminu na jego złożenie; może w niej uczestniczyć kierujący komórką organizacyjną.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 8 ust. 1", strona: 3,
         cytat_dosłowny: "przeprowadza z ocenianym rozmowę oceniającą niezwłocznie po złożeniu sprawozdania"}

  - id: FAQ-P12
    sciezka: pierwsza
    pytania:
      - warunki oceny pozytywnej w pierwszej ocenie
      - ile ocen za 3 punkty dopuszcza pozytywna pierwsza ocena
      - minimalna ocena łączna do zaliczenia pierwszej oceny
    odpowiedz: Zaliczony egzamin ze służby przygotowawczej, sprawozdanie złożone w terminie, najwyżej jedna ocena cząstkowa za 3 pkt i ocena łączna co najmniej 5 pkt. Niespełnienie któregoś warunku = ocena negatywna.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 10 ust. 1", strona: 3,
         cytat_dosłowny: "uzyskanie nie więcej niż jednej oceny cząstkowej, o której mowa w § 7 pkt 2, w wysokości 3 punktów"}

  - id: FAQ-P13
    sciezka: pierwsza
    pytania:
      - kto jest zwolniony z wymogu egzaminu ze służby przygotowawczej przy pierwszej ocenie
      - wyjątki od zaliczenia egzaminu KSAP zastępstwo wyższe stanowisko
    odpowiedz: Absolwent KSAP bez wniosku o mianowanie, osoba zatrudniona na zastępstwo podlegająca pierwszej ocenie oraz osoba na wyższym stanowisku w służbie cywilnej.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 10 ust. 3", strona: 3,
         cytat_dosłowny: "absolwentem Krajowej Szkoły Administracji Publicznej, który nie złożył wniosku o mianowanie w służbie cywilnej"}

  - id: FAQ-P14
    sciezka: pierwsza
    pytania:
      - obowiązek uzasadnienia pierwszej oceny
      - uzasadnienie oceny pozytywnej i negatywnej w pierwszej ocenie
    odpowiedz: Przy ocenie negatywnej uzasadnienie jest obowiązkowe; przy pozytywnej przełożony może je sporządzić.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 10 ust. 4", strona: 3,
         cytat_dosłowny: "W przypadku przyznania negatywnej pierwszej oceny bezpośredni przełożony sporządza uzasadnienie przyznanej oceny."}

  - id: FAQ-P15
    sciezka: pierwsza
    pytania:
      - wnioski rozwojowe w pierwszej ocenie
      - czy w arkuszu pierwszej oceny wpisuje się plan rozwoju
    odpowiedz: Tylko przy ocenie pozytywnej; przełożony w porozumieniu z kierującym komórką może sporządzić wnioski dotyczące rozwoju zawodowego.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 10 ust. 6", strona: 3,
         cytat_dosłowny: "może sporządzić w arkuszu wnioski dotyczące rozwoju zawodowego"}

  - id: FAQ-P16
    sciezka: pierwsza
    pytania:
      - co się dzieje z arkuszem pierwszej oceny po jej zakończeniu
      - akta osobowe a arkusz pierwszej oceny
    odpowiedz: Przełożony niezwłocznie umożliwia zapoznanie się z oceną; oryginał arkusza ze sprawozdaniem i pismami o terminach trafia do akt osobowych, a kopia do ocenianego.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 11 ust. 2", strona: 3,
         cytat_dosłowny: "oryginał arkusza wraz ze sprawozdaniem i pismami dotyczącymi"}

  - id: FAQ-P17
    sciezka: pierwsza
    pytania:
      - którzy pracownicy muszą przejść pierwszą ocenę
      - osoby objęte obowiązkiem pierwszej oceny
      - kto podlega obowiązkowo pierwszej ocenie w urzędzie
    odpowiedz: Osoba podejmująca po raz pierwszy pracę w służbie cywilnej, z którą zawarto umowę o pracę na czas określony 12 miesięcy (poradnik KPRM, powołuje art. 35 ust. 3 i art. 37 ust. 1 ustawy).
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza,
         lokalizator: "rozdz. 3. Kto podlega pierwszej ocenie w służbie cywilnej?", strona: 6,
         cytat_dosłowny: "pierwszej ocenie obligatoryjnie podlega osoba, o której mowa w art. 35 ust. 3 ustawy"}

  - id: FAQ-P18
    sciezka: pierwsza
    pytania:
      - w jaki sposób omówić z nowym pracownikiem przyznane oceny cząstkowe
      - informacja zwrotna przy uzasadnieniu pierwszej oceny
    odpowiedz: Uzasadnienie oceny – najlepiej z konkretnymi przykładami – sporządza się z wykorzystaniem reguł i technik udzielania informacji zwrotnej, tak aby oceniany wiedział, co zmienić w sposobie wykonywania obowiązków.
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza,
         lokalizator: "s. 32", strona: 32,
         cytat_dosłowny: "Sporządzenie uzasadnienia każdej przyznanej oceny powinno się odbywać z wykorzystaniem reguł i technik udzielania informacji zwrotnej."}

  # ======================= OCENA OKRESOWA (rozp. 2016) =======================
  - id: FAQ-O01
    sciezka: okresowa
    pytania:
      - kryteria obowiązkowe a dodatkowe
      - czym różnią się kryteria dodatkowe od obowiązkowych
    odpowiedz: Kryteria dzielą się na obowiązkowe i dodatkowe; dodatkowe oceniający może wybrać, jeśli uzasadnia to charakter obowiązków z opisu stanowiska.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 2 ust. 2", strona: 1,
         cytat_dosłowny: "Kryteria oceny dzielą się na kryteria obowiązkowe i kryteria dodatkowe"}

  - id: FAQ-O02
    sciezka: okresowa
    pytania:
      - do kogo stosuje się arkusz A
      - arkusz oceny dla kierownika urzędu
    odpowiedz: Arkusz A – dla zatrudnionego na stanowisku kierownika urzędu, które jest stanowiskiem w służbie cywilnej.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 3 ust. 2", strona: 1,
         cytat_dosłowny: "służy do sporządzenia oceny zatrudnio-\nnego na stanowisku kierownika urzędu"}

  - id: FAQ-O03
    sciezka: okresowa
    pytania:
      - kiedy stosuje się arkusz B
      - arkusz oceny dla naczelnika lub kierownika komórki
      - formularz dla kogoś kto bezpośrednio kieruje ludźmi
    odpowiedz: Arkusz B – stanowisko, na którym praca polega na bezpośrednim kierowaniu pracownikami (inne niż kierownik urzędu).
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 3 ust. 3", strona: 1,
         cytat_dosłowny: "na którym praca polega na bezpośrednim kierowaniu pracownikami"}

  - id: FAQ-O04
    sciezka: okresowa
    pytania:
      - kiedy stosuje się arkusz C
      - arkusz oceny dla stanowiska bez funkcji kierowniczej
    odpowiedz: Arkusz C – każde inne stanowisko niż kierownik urzędu i stanowiska kierownicze (bezpośrednie kierowanie pracownikami).
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 3 ust. 4", strona: 1,
         cytat_dosłowny: "na innym stanowisku pracy niż stanowiska wymienione w ust. 2 i 3"}

  - id: FAQ-O05
    sciezka: okresowa
    pytania:
      - kryteria obowiązkowe arkusz B
      - które kryteria są obowiązkowe dla kadry kierowniczej
    odpowiedz: Zarządzanie ludźmi; podejmowanie decyzji i odpowiedzialność; organizacja pracy i orientacja na osiąganie celów; współpraca; komunikacja.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 4 ust. 2", strona: 2,
         cytat_dosłowny: "Ocenianego zatrudnionego na stanowisku, o którym mowa w § 3 ust. 3, ocenia się, stosując następujące kryteria obo-\nwiązkowe"}

  - id: FAQ-O06
    sciezka: okresowa
    pytania:
      - kryteria obowiązkowe arkusz C
      - obowiązkowe kryteria dla stanowiska wykonawczego
      - które kryteria obowiązkowe ma specjalista lub radca
    odpowiedz: Wykorzystywanie wiedzy i doskonalenie zawodowe; rzetelność; organizacja pracy i orientacja na osiąganie celów; współpraca; komunikacja.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 4 ust. 3", strona: 2,
         cytat_dosłowny: "Ocenianego zatrudnionego na stanowisku, o którym mowa w § 3 ust. 4, ocenia się, stosując następujące kryteria obowiązkowe"}

  - id: FAQ-O07
    sciezka: okresowa
    pytania:
      - limit kryteriów dodatkowych
      - kryteria dodatkowe do wybrania
      - ile kryteriów dodatkowych wolno dobrać z wykazu
    odpowiedz: Najwyżej 3, najistotniejsze ze względu na obowiązki z opisu stanowiska.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 5 ust. 2", strona: 2,
         cytat_dosłowny: "nie więcej niż 3 kryteria dodatkowe"}

  - id: FAQ-O08
    sciezka: okresowa
    pytania:
      - co omawia się na rozmowie otwierającej okres oceny
      - zakres rozmowy na początku oceny okresowej
    odpowiedz: Główne obowiązki z opisu stanowiska, kryteria obowiązkowe i wybrane dodatkowe, oczekiwania oceniającego oraz – gdy uzasadnione – cele na okres oceny.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 5 ust. 1", strona: 2,
         cytat_dosłowny: "Oceniający przeprowadza z ocenianym rozmowę, podczas której omawia się"}

  - id: FAQ-O09
    sciezka: okresowa
    pytania:
      - termin na ustalenie kryteriów oceny okresowej
      - w jakim czasie od poprzedniej oceny ustala się kryteria
      - 30 dni czy 7 dni na rozmowę i kryteria
    odpowiedz: 30 dni od sporządzenia poprzedniej oceny lub od zatrudnienia na czas nieokreślony; 7 dni od sporządzenia oceny negatywnej.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 7", strona: 2,
         cytat_dosłowny: "7 dni od dnia sporządzenia na piśmie negatywnej oceny"}

  - id: FAQ-O10
    sciezka: okresowa
    pytania:
      - zmiana stanowiska pracownika w trakcie okresu oceny
      - pracownik zmienił stanowisko po 4 miesiącach co z kryteriami
    odpowiedz: Jeśli w ciągu 6 miesięcy od ustalenia kryteriów (lub od ostatniej oceny) zmiana stanowiska istotnie zmienia obowiązki, w 30 dni ponawia się rozmowę i ustalenie kryteriów; termin oceny się nie zmienia.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 9 ust. 1", strona: 2,
         cytat_dosłowny: "termin sporządzenia oceny nie ulega zmianie"}

  - id: FAQ-O11
    sciezka: okresowa
    pytania:
      - nowy oceniający w trakcie okresu oceny
      - zmiana bezpośredniego przełożonego a kryteria oceny
    odpowiedz: Ocena jest sporządzana na podstawie kryteriów wybranych wcześniej.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 9 ust. 3", strona: 3,
         cytat_dosłowny: "ocena jest sporządzana na podstawie wybranych wcześniej kryteriów"}

  - id: FAQ-O12
    sciezka: okresowa
    pytania:
      - co omawia się na rozmowie oceniającej w ocenie okresowej
      - rozmowa przed sporządzeniem oceny na piśmie
    odpowiedz: Główne obowiązki i sposób ich realizacji wobec kryteriów, realizację wyznaczonych celów oraz kierunki rozwoju zawodowego i potrzeby szkoleniowe.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 10", strona: 3,
         cytat_dosłowny: "Przed sporządzeniem oceny na piśmie oceniający przeprowadza z ocenianym rozmowę oceniającą"}

  - id: FAQ-O13
    sciezka: okresowa
    pytania:
      - skala ocen cząstkowych 1 3 5 7 9
      - punktacja kryteriów w ocenie okresowej
    odpowiedz: 1 – znacznie poniżej, 3 – poniżej, 5 – na poziomie, 7 – powyżej, 9 – znacznie powyżej oczekiwań.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 11 ust. 1 pkt 1", strona: 3,
         cytat_dosłowny: "znacznie powyżej oczekiwań – 9 punktów"}

  - id: FAQ-O14
    sciezka: okresowa
    pytania:
      - przeliczenie średniej na ogólny poziom spełniania kryteriów
      - progi średniej arytmetycznej w ocenie okresowej
    odpowiedz: Do 2 pkt – znacznie poniżej; >2–4 – poniżej; >4–6 – na poziomie; >6–8 – powyżej; >8–9 – znacznie powyżej oczekiwań.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 11 ust. 1 pkt 2", strona: 3,
         cytat_dosłowny: "na poziomie oczekiwań – powyżej 4 punktów do 6 punktów"}

  - id: FAQ-O15
    sciezka: okresowa
    pytania:
      - kiedy ocena okresowa jest negatywna
      - w jakim przypadku ocena okresowa jest negatywna
      - ocena cząstkowa znacznie poniżej oczekiwań a wynik oceny
    odpowiedz: Gdy ogólny poziom to „poniżej” lub „znacznie poniżej oczekiwań” albo gdy choć jedna ocena cząstkowa jest „znacznie poniżej oczekiwań” – niezależnie od średniej.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 11 ust. 1 pkt 4", strona: 3,
         cytat_dosłowny: "a także w przypadku uzyskania przez ocenianego co najmniej jednej oceny cząstkowej na poziomie znacznie poniżej oczekiwań"}

  - id: FAQ-O16
    sciezka: okresowa
    pytania:
      - indywidualny program rozwoju zawodowego w ocenie okresowej
      - IPRZ wnioski w arkuszu
    odpowiedz: Sporządzenie oceny obejmuje wpisanie do arkusza wniosków dotyczących indywidualnego programu rozwoju zawodowego.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 11 ust. 1 pkt 5", strona: 3,
         cytat_dosłowny: "wpisaniu do arkusza wniosków dotyczących indywidualnego programu rozwoju zawodowego ocenianego"}

  - id: FAQ-O17
    sciezka: okresowa
    pytania:
      - uzasadnienie oceny okresowej
      - czy uzasadniać pozytywną ocenę okresową
    odpowiedz: Przy ocenie negatywnej uzasadnienie jest obowiązkowe; przy pozytywnej oceniający może je sporządzić.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 11 ust. 3", strona: 3,
         cytat_dosłowny: "Oceniający sporządza uzasadnienie przyznanej oceny w przypadku przyznania oceny negatywnej."}

  - id: FAQ-O18
    sciezka: okresowa
    pytania:
      - kolejny stopień służbowy w ocenie okresowej
      - część III arkusza wniosek awansowy
    odpowiedz: Przy ocenie pozytywnej urzędnika służby cywilnej oceniający może złożyć umotywowany wniosek o kolejny stopień służbowy w części III arkusza.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 11 ust. 5", strona: 3,
         cytat_dosłowny: "umotywowany wniosek o przyznanie ocenianemu kolejnego stopnia służbowego, wypełniając część III arkusza"}

  - id: FAQ-O19
    sciezka: okresowa
    pytania:
      - co po sporządzeniu oceny okresowej na piśmie
      - doręczenie kopii arkusza oceny okresowej
    odpowiedz: Oceniający niezwłocznie zapoznaje ocenianego z oceną; oryginał trafia do akt osobowych, a kopię doręcza się ocenianemu.
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 12 ust. 1", strona: 4,
         cytat_dosłowny: "Oceniający niezwłocznie zapoznaje ocenianego z oceną sporządzoną na piśmie."}

  - id: FAQ-O20
    sciezka: okresowa
    pytania:
      - cykl oceny okresowej
      - częstotliwość ocen okresowych w służbie cywilnej
    odpowiedz: Co 24 miesiące, licząc od zakończenia poprzedniej oceny lub od zatrudnienia na czas nieokreślony (poradnik KPRM, powołuje art. 81 ustawy).
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa,
         lokalizator: "rozdz. 4. Termin sporządzenia oceny okresowej w służbie cywilnej", strona: 8,
         cytat_dosłowny: "Ocenę okresową w służbie cywilnej sporządza się co 24 miesiące"}

  - id: FAQ-O21
    sciezka: okresowa
    pytania:
      - sprzeciw od oceny okresowej termin i adresat
      - procedura sprzeciwu dyrektor generalny
      - w jakim terminie można wnieść sprzeciw od oceny okresowej
      - ile dni na sprzeciw od oceny okresowej
    odpowiedz: Sprzeciw wnosi się do dyrektora generalnego urzędu w 7 dni od zapoznania się z oceną; rozpatruje się go w 14 dni (poradnik KPRM, powołuje art. 83 ustawy).
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa,
         lokalizator: "rozdz. 7. Sprzeciw od otrzymanej oceny", strona: 32,
         cytat_dosłowny: "Od oceny okresowej służy sprzeciw do dyrektora generalnego urzędu w terminie 7 dni od dnia zapoznania"}

  - id: FAQ-O22
    sciezka: okresowa
    pytania:
      - skutki drugiej z rzędu negatywnej oceny okresowej urzędnika
      - następstwa negatywnej oceny okresowej dla pracownika
    odpowiedz: Po pierwszej negatywnej ocenie przeprowadza się ponowną ocenę; urzędnika służby cywilnej, który otrzyma drugą kolejną negatywną ocenę okresową, czeka rozwiązanie stosunku pracy (poradnik KPRM, powołuje art. 71 ust. 1 pkt 1 ustawy).
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa,
         lokalizator: "s. 34", strona: 34,
         cytat_dosłowny: "który otrzyma drugą kolejną negatywną ocenę okresową czeka rozwiązanie stosunku pracy"}

  - id: FAQ-O23
    sciezka: okresowa
    pytania:
      - w jaki sposób omówić z pracownikiem przyznane oceny cząstkowe na rozmowie
      - informacja zwrotna na rozmowie oceniającej
    odpowiedz: Na rozmowie oceniającej przełożony przekazuje informację zwrotną o wykonywanej pracy, motywuje i planuje rozwój; rozmowa nie powinna być monologiem oceniającego. Ocenę cząstkową uzasadnij konkretnym przykładem zachowania.
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa,
         lokalizator: "s. 25", strona: 25,
         cytat_dosłowny: "Celem rozmowy poprzedzającej przyznanie oceny jest nie tylko ocenienie pracownika i przekazanie mu informacji zwrotnej na temat wykonywanej pracy"}

  # ======================= MODEL KOMPETENCJI (obie ścieżki) =======================
  - id: FAQ-M01
    sciezka: wspolne
    pytania:
      - brak okazji do obserwacji wskaźnika
      - wskaźnik behawioralny bez obserwacji co zaznaczyć
    odpowiedz: Odnotuj brak podstaw do oceny danego wskaźnika.
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: model-kompetencji, lokalizator: "Model kompetencji!A6",
         cytat_dosłowny: "odnotuj brak podstaw do oceny danego wskaźnika"}

  - id: FAQ-M02
    sciezka: wspolne
    pytania:
      - na czym opierać ocenę kompetencji
      - jak dokumentować przykłady zachowań pracownika
    odpowiedz: Na konkretnych przykładach z ocenianego okresu – sytuacja, działanie, rezultat – z uwzględnieniem powtarzalności, złożoności i dostępnych uprawnień.
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: model-kompetencji, lokalizator: "Model kompetencji!A5",
         cytat_dosłowny: "Oprzyj ocenę na konkretnych przykładach z ocenianego okresu."}

  # ======================= PYTANIA Z PRÓBY JURY (#53) =======================
  # Pozycje dopisane po próbie 30 pytań (pkt 6 zadania MC): pytania-jury.yaml. Warianty nie
  # kopiują pytań z tej próby. Numery FAQ-O22, FAQ-O23, FAQ-P17 i FAQ-P18 są zajęte przez
  # gałąź 53-asystent-jury.
  - id: FAQ-O24
    sciezka: okresowa
    pytania:
      - kto przeprowadza ocenę okresową
      - kto jest oceniającym w ocenie okresowej
      - czy ocenę okresową robi dyrektor departamentu czy bezpośredni przełożony
    odpowiedz: "Bezpośredni przełożony ocenianego (oceniający), według kryteriów odpowiednich dla stanowiska. W ocenie okresowej nie uczestniczy kierujący komórką organizacyjną, chyba że sam jest bezpośrednim przełożonym."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 81 ust. 1", strona: 24,
         cytat_dosłowny: "podlega ocenie okresowej dokonywanej przez bezpośredniego przełożonego"}
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 3. Zakres podmiotowy oceny okresowej", strona: 7,
         cytat_dosłowny: "nie uczestniczy w niej kierujący komórką organizacyjną"}

  - id: FAQ-O25
    sciezka: okresowa
    pytania:
      - kogo obejmuje ocena okresowa
      - czy osoba na umowie na czas określony podlega ocenie okresowej
      - ocena okresowa a pracownik na zastępstwo
    odpowiedz: "Ocenie okresowej podlega urzędnik służby cywilnej i pracownik służby cywilnej zatrudniony na czas nieokreślony. Nie podlegają jej osoby zatrudnione na czas określony, w tym na zastępstwo. Urząd może je oceniać w ramach oceny bieżącej."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 3. Zakres podmiotowy oceny okresowej", strona: 7,
         cytat_dosłowny: "ocenie okresowej podlega urzędnik służby cywilnej i pracownik służby cywilnej zatrudniony na czas nieokreślony"}
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 81 ust. 1", strona: 24,
         cytat_dosłowny: "zatrudniony na podstawie umowy o pracę na czas nieokreślony podlega ocenie okresowej"}

  - id: FAQ-O26
    sciezka: okresowa
    pytania:
      - ponowna ocena po negatywnej ocenie okresowej
      - po ilu miesiącach ocenia się ponownie pracownika z oceną negatywną
      - co dalej po negatywnej ocenie okresowej
      - kiedy kolejna ocena po ocenie negatywnej
    odpowiedz: "Po ocenie negatywnej oceniany podlega ponownej ocenie po upływie 6 miesięcy od dnia zapoznania się z nią (art. 81 ust. 9 ustawy). Rozmowę i zapoznanie z kryteriami przeprowadza się w ciągu 7 dni od sporządzenia negatywnej oceny na piśmie (§ 7 pkt 2)."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 81 ust. 9", strona: 25,
         cytat_dosłowny: "oceniany podlega ponownej ocenie po upływie 6 miesięcy od dnia zapoznania się z oceną"}
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 7 pkt 2", strona: 2,
         cytat_dosłowny: "7 dni od dnia sporządzenia na piśmie negatywnej oceny"}

  - id: FAQ-O27
    sciezka: okresowa
    pytania:
      - długa nieobecność a termin oceny okresowej
      - czy urlop macierzyński albo L4 przesuwa ocenę okresową
      - przedłużenie 24 miesięcy o czas nieobecności
      - zwolnienie lekarskie a termin oceny okresowej
    odpowiedz: "Tak, jeśli usprawiedliwiona nieobecność (np. zwolnienie lekarskie albo urlop macierzyński) trwa dłużej niż miesiąc. Termin 24 miesięcy przedłuża się wtedy o czas tej nieobecności (art. 81 ust. 7 ustawy)."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 81 ust. 7", strona: 24,
         cytat_dosłowny: "ulega przedłużeniu o czas tej nieobecności"}
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 5.1. Obligatoryjna zmiana terminu", strona: 11,
         cytat_dosłowny: "termin 24-miesięczny na sporządzenie oceny okresowej ulega przedłużeniu o czas tej nieobecności"}

  - id: FAQ-O28
    sciezka: okresowa
    pytania:
      - podpis ocenianego na arkuszu oceny okresowej
      - czy pracownik dostaje kopię arkusza oceny
      - potwierdzenie zapoznania się z oceną okresową
    odpowiedz: "Tak. Na początku oceniany potwierdza podpisem rozmowę oraz zapoznanie z kryteriami i terminem, a oceniający doręcza mu kopię części I (§ 6). Po sporządzeniu oceny oceniający zapoznaje z nią ocenianego, oryginał arkusza trafia do akt osobowych, a kopię doręcza się ocenianemu (§ 12)."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 12 ust. 2", strona: 4,
         cytat_dosłowny: "kopię arkusza oceniający doręcza ocenianemu"}
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 6 ust. 2", strona: 2,
         cytat_dosłowny: "Oceniany potwierdza podpisem przeprowadzenie z nim rozmowy"}

  - id: FAQ-O29
    sciezka: okresowa
    pytania:
      - od ilu punktów zaczynać ocenę cząstkową
      - domyślna ocena kryterium w ocenie okresowej
      - jak zdecydować czy dać 5 czy 7 punktów
      - od jakiej oceny zacząć przyznawanie ocen cząstkowych
    odpowiedz: "Punktem wyjścia jest ocena na poziomie oczekiwań (5 pkt). Po analizie zebranych informacji oceniający rozważa jej podniesienie albo obniżenie. Ocena ma wynikać z rzeczywistych zachowań pracownika, a nie z ogólnego wrażenia."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.5.1. Przyznanie ocen cząstkowych i skala ocen", strona: 26,
         cytat_dosłowny: "Punktem wyjścia przy przyznawaniu oceny cząstkowej za dane kryterium powinna być ocena na poziomie oczekiwań"}

  - id: FAQ-O30
    sciezka: okresowa
    pytania:
      - czy kryteria dodatkowe są obowiązkowe
      - ocena okresowa bez kryteriów dodatkowych
      - czy można nie wybrać żadnego kryterium dodatkowego
      - czy wybór kryteriów dodatkowych jest obowiązkowy
      - wybrać kryteria dodatkowe czy tylko obowiązkowe
    odpowiedz: "Nie są obowiązkowe. Oceniający może wybrać do 3 kryteriów dodatkowych, jeśli uzasadnia to charakter obowiązków z opisu stanowiska. Może też nie wybrać żadnego."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.2. Ewentualny wybór dodatkowych kryteriów oceny", strona: 22,
         cytat_dosłowny: "można w ogóle nie wybierać dodatkowych kryteriów oceny"}
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 2 ust. 2", strona: 1,
         cytat_dosłowny: "które oceniający może wybrać, jeżeli jest to uzasadnione"}

  - id: FAQ-O31
    sciezka: okresowa
    pytania:
      - wcześniejsza ocena okresowa na prośbę pracownika
      - kiedy oceniający może zmienić termin oceny okresowej
      - zmiana terminu oceny przy zmianie przełożonego lub długiej nieobecności
      - wniosek ocenianego o zmianę terminu oceny okresowej
    odpowiedz: "Tak. Oceniający może zmienić termin m.in. na wniosek ocenianego, przy zmianie oceniającego albo przy przewidywanej dłuższej nieobecności, jeśli od ostatniej oceny minęło ponad 6 miesięcy (art. 81 ust. 8 ustawy). O nowym terminie niezwłocznie zawiadamia ocenianego na piśmie, a kopię pisma dołącza do arkusza (§ 8)."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 5.2. Fakultatywna zmiana terminu", strona: 15,
         cytat_dosłowny: "złożenia przez ocenianego wniosku o zmianę terminu przeprowadzenia oceny"}
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 8", strona: 2,
         cytat_dosłowny: "oceniający niezwłocznie zawiadamia pisemnie ocenianego o nowym terminie"}

  - id: FAQ-O32
    sciezka: okresowa
    pytania:
      - kolejny stopień służbowy z mocy prawa
      - dwie oceny na najwyższych poziomach a stopień służbowy
      - stopień służbowy bez wniosku przełożonego
    odpowiedz: "Urzędnik, który od otrzymania ostatniego stopnia uzyskał dwie kolejne pozytywne oceny okresowe na jednym z dwóch najwyższych poziomów skali, otrzymuje kolejny stopień w ciągu 30 dni od zapoznania z oceną (art. 89 ust. 2 ustawy). W pozostałych przypadkach potrzebny jest umotywowany wniosek przełożonego w części III arkusza (§ 11 ust. 5)."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 89 ust. 2", strona: 26,
         cytat_dosłowny: "uzyskał dwie kolejne następujące po sobie pozytywne oceny okresowe na jednym z dwóch najwyższych poziomów"}

  - id: FAQ-P19
    sciezka: pierwsza
    pytania:
      - między którym a którym miesiącem robi się pierwszą ocenę
      - najpóźniejszy termin dokonania pierwszej oceny
      - czy pierwszą ocenę można zrobić przed upływem 8 miesięcy
    odpowiedz: "Nie wcześniej niż po upływie 8 miesięcy od nawiązania stosunku pracy i nie później niż miesiąc przed końcem umowy (art. 38 ust. 1 ustawy). Przy umowie na 12 miesięcy to okres od 8. do 11. miesiąca."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 4. Termin sporządzenia pierwszej oceny", strona: 8,
         cytat_dosłowny: "Pierwszej oceny dokonuje się nie wcześniej niż po upływie 8 miesięcy od dnia nawiązania stosunku pracy"}

  - id: FAQ-P20
    sciezka: pierwsza
    pytania:
      - sprawozdanie złożone po terminie a pierwsza ocena
      - brak sprawozdania w pierwszej ocenie
      - spóźnione sprawozdanie skutki
      - niezłożenie sprawozdania w wyznaczonym terminie
      - nowy pracownik złożył sprawozdanie po wyznaczonym terminie
      - pracownik nie oddał sprawozdania na czas
    odpowiedz: "Złożenie sprawozdania w wyznaczonym terminie jest warunkiem pozytywnej pierwszej oceny. Bez tego ocena jest negatywna, nawet przy dobrej ocenie łącznej i zdanym egzaminie. Przy usprawiedliwionej nieobecności przełożony wyznacza nowy termin (§ 5)."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 10 ust. 2", strona: 3,
         cytat_dosłowny: "Negatywną pierwszą ocenę przyznaje się w przypadku niespełnienia warunków określonych w ust. 1."}
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 10 ust. 1 pkt 2", strona: 3,
         cytat_dosłowny: "złożenie sprawozdania w wyznaczonym terminie"}

  - id: FAQ-P21
    sciezka: pierwsza
    pytania:
      - dwie oceny cząstkowe za 3 punkty w pierwszej ocenie
      - czy średnia powyżej 5 wystarczy przy kilku ocenach poniżej oczekiwań
      - kilka elementów poniżej oczekiwań a wynik pierwszej oceny
    odpowiedz: "Nie wystarczy. Pozytywna pierwsza ocena dopuszcza najwyżej jedną ocenę cząstkową 3 pkt. Przy dwóch lub więcej ocena jest negatywna, nawet gdy ocena łączna wynosi co najmniej 5 pkt."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 10 ust. 1 pkt 3", strona: 3,
         cytat_dosłowny: "uzyskanie nie więcej niż jednej oceny cząstkowej"}

  - id: FAQ-P22
    sciezka: pierwsza
    pytania:
      - umowa na czas nieokreślony po pierwszej ocenie
      - wniosek do dyrektora generalnego po pierwszej ocenie
      - co z umową po negatywnej pierwszej ocenie
      - wniosek o umowę na czas nieokreślony po pozytywnej pierwszej ocenie
    odpowiedz: "Kierujący komórką organizacyjną wnioskuje do dyrektora generalnego urzędu: po ocenie pozytywnej o zawarcie umowy na czas nieokreślony, a po negatywnej o niezawieranie takiej umowy albo o rozwiązanie umowy na czas określony (art. 38 ust. 3 ustawy)."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 38 ust. 3", strona: 17,
         cytat_dosłowny: "kierujący komórką organizacyjną wnioskuje do dyrektora generalnego urzędu"}
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 7. Konsekwencje dokonania pierwszej oceny", strona: 34,
         cytat_dosłowny: "kierujący komórką organizacyjną składa wniosek o zawarcie"}

  - id: FAQ-P23
    sciezka: pierwsza
    pytania:
      - czas trwania służby przygotowawczej
      - kiedy kończy się służba przygotowawcza
      - kto kieruje na służbę przygotowawczą
      - jak długo trwa służba przygotowawcza
    odpowiedz: "Nie dłużej niż 4 miesiące. Służba przygotowawcza musi się skończyć nie później niż z upływem 8 miesięcy od podjęcia pracy (art. 36 ust. 4 ustawy) i kończy się egzaminem."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 5.1. Organizacja służby przygotowawczej", strona: 14,
         cytat_dosłowny: "Powinna trwać nie dłużej niż 4 miesiące"}

  - id: FAQ-P24
    sciezka: pierwsza
    pytania:
      - zwolnienie ze służby przygotowawczej a egzamin
      - czy zwolniony ze służby przygotowawczej przystępuje do egzaminu
      - egzamin po zwolnieniu z art. 36 ust. 7
    odpowiedz: "Tak. Zwolnienie z obowiązku odbywania służby przygotowawczej (art. 36 ust. 7 ustawy) nie zwalnia z egzaminu (art. 36 ust. 8), a zaliczenie egzaminu jest warunkiem pozytywnej pierwszej oceny."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 5.3. Egzamin kończący służbę przygotowawczą", strona: 16,
         cytat_dosłowny: "nie oznacza zwolnienia z egzaminu"}

  - id: FAQ-P25
    sciezka: pierwsza
    pytania:
      - pierwsza ocena pracownika na zastępstwo
      - czy umowa na zastępstwo może zakończyć się pierwszą oceną
      - zgoda na pierwszą ocenę przy zastępstwie
    odpowiedz: "Tak, ale to możliwość, a nie obowiązek. Potrzebne jest porozumienie stron, a terminy liczy się od dnia tego ustalenia (rozmowa wstępna w 21 dni, § 3). Egzamin ze służby przygotowawczej nie jest wtedy wymagany (§ 10 ust. 3 pkt 2)."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 3. Kto podlega pierwszej ocenie w służbie cywilnej?", strona: 6,
         cytat_dosłowny: "Osoba zatrudniona w celu zastępstwa może podlegać pierwszej ocenie."}

  - id: FAQ-P26
    sciezka: pierwsza
    pytania:
      - przedłużenie umowy 12-miesięcznej o czas choroby
      - nieobecność dłuższa niż 3 miesiące w pierwszym roku pracy
      - art. 35 ust. 4 przedłużenie umowy
    odpowiedz: "Tak, ale nie automatycznie. Przy usprawiedliwionej nieobecności dłuższej niż 3 miesiące dyrektor generalny urzędu może, na wniosek pracownika, przedłużyć umowę o czas tej nieobecności (art. 35 ust. 4 ustawy). Przełożony wyznacza wtedy nowy termin sprawozdania (§ 5 ust. 2)."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 35 ust. 4", strona: 16,
         cytat_dosłowny: "dyrektor generalny urzędu, na wniosek pracownika, może przedłużyć okres trwania umowy"}
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 5 ust. 2", strona: 2,
         cytat_dosłowny: "w przypadku przedłużenia okresu trwania umowy o pracę"}

  - id: FAQ-P27
    sciezka: pierwsza
    pytania:
      - sprzeciw od pierwszej oceny
      - odwołanie od negatywnej pierwszej oceny
      - czy oceniany może zakwestionować pierwszą ocenę
    odpowiedz: "W bazie wiedzy nie ma przepisu o sprzeciwie od pierwszej oceny. Ustawa przewiduje sprzeciw do dyrektora generalnego urzędu w 7 dni tylko od oceny okresowej (art. 83 ust. 1), a rozporządzenie z 2015 r. i poradnik o pierwszej ocenie go nie opisują."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: ustawa-sc, lokalizator: "art. 83 ust. 1", strona: 25,
         cytat_dosłowny: "Od oceny okresowej służy, w terminie 7 dni od dnia zapoznania się z oceną, sprzeciw"}

  # ----------------------- przygotowanie do rozmowy -----------------------
  - id: FAQ-R01
    sciezka: okresowa
    pytania:
      - o co pytać pracownika podczas rozmowy oceniającej
      - scenariusz rozmowy oceniającej w ocenie okresowej
      - przykładowe pytania do rozmowy oceniającej
    odpowiedz: "Rozmowa obejmuje: (1) główne obowiązki w okresie oceny i sposób ich realizacji wobec kryteriów, (2) realizację wyznaczonych celów, (3) kierunki rozwoju i potrzeby szkoleniowe (§ 10). Przykładowe pytania (propozycja, nie cytat): Które zadanie uważa Pan/Pani za największe osiągnięcie i dlaczego? Gdzie pojawiły się trudności i co zrobił(a)by Pan/Pani inaczej? Jak ocenia Pan/Pani realizację wyznaczonego celu? Czego potrzebuje Pan/Pani, żeby rozwijać się w tym kryterium? Rozmowa ma być dialogiem, a nie monologiem oceniającego."
    adnotacje:
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 10", strona: 3,
         cytat_dosłowny: "przeprowadza z ocenianym rozmowę oceniającą"}
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.4. Rozmowa oceniająca", strona: 25,
         cytat_dosłowny: "nie była monologiem oceniającego, lecz dialogiem oceniającego z ocenianym"}

  - id: FAQ-R02
    sciezka: okresowa
    pytania:
      - pracownik nie akceptuje oceny podczas rozmowy
      - jak rozmawiać z pracownikiem który kwestionuje ocenę
      - emocje pracownika na rozmowie oceniającej
      - jak prowadzić trudną rozmowę oceniającą
    odpowiedz: "Prowadź dialog: daj pracownikowi przedstawić własną ocenę i argumenty. Opieraj się na faktach zebranych w całym okresie, a nie na ogólnym wrażeniu, i powiedz, co konkretnie warto zmienić. Wnioski z rozmowy weź pod uwagę przy sporządzaniu oceny (§ 11 ust. 2). Jeśli pracownik nadal się nie zgadza, poinformuj go o prawie do sprzeciwu do dyrektora generalnego urzędu w ciągu 7 dni od zapoznania się z oceną."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.4. Rozmowa oceniająca", strona: 25,
         cytat_dosłowny: "nie była monologiem oceniającego, lecz dialogiem oceniającego z ocenianym"}
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.7. Zakończenie procesu oceny okresowej", strona: 31,
         cytat_dosłowny: "pouczeniu ocenianego o przysługującym mu prawie sprzeciwu"}

  - id: FAQ-R03
    sciezka: okresowa
    pytania:
      - jak napisać uzasadnienie oceny negatywnej
      - argumenty w uzasadnieniu oceny okresowej
      - co powinno zawierać uzasadnienie oceny okresowej
    odpowiedz: "Uzasadnienie oceny negatywnej jest obowiązkowe (§ 11 ust. 3). Może być ogólnym omówieniem oceny albo odnosić się do wszystkich lub wybranych ocen cząstkowych. Najmocniejsze jest powiązanie każdej niskiej oceny z konkretnymi zachowaniami i z oczekiwaniami przekazanymi na rozmowie rozpoczynającej okres oceny."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.5.3. Uzasadnianie przyznanych ocen cząstkowych", strona: 28,
         cytat_dosłowny: "szczegółowym odniesieniu się do wszystkich ocen cząstkowych"}

  - id: FAQ-R04
    sciezka: pierwsza
    pytania:
      - przygotowanie do rozmowy oceniającej w pierwszej ocenie
      - robocza wersja pierwszej oceny przed rozmową
      - co mieć przed rozmową oceniającą z nowym pracownikiem
    odpowiedz: "Przed rozmową przygotuj z kierującym komórką organizacyjną roboczą wersję oceny: oceny 5 elementów z konkretnymi przykładami zachowań, ocenę zadań na podstawie zebranych informacji i sprawozdania oraz proponowany poziom oceny. Sprawdź też wynik egzaminu ze służby przygotowawczej i to, czy sprawozdanie złożono w terminie."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 6.5.1. Rozmowa oceniająca", strona: 27,
         cytat_dosłowny: "powinien przygotować roboczą wersję oceny pracownika"}

  - id: FAQ-R05
    sciezka: pierwsza
    pytania:
      - rozmowa oceniająca przy negatywnej pierwszej ocenie
      - jak przekazać nowemu pracownikowi negatywną ocenę
      - rozmowa z nowym pracownikiem który nie spełnia oczekiwań
    odpowiedz: "Daj pracownikowi powiedzieć, jak sam ocenia swoją postawę, zaangażowanie, postępy, relacje i terminowość. Omów każdy element na konkretnych przykładach. Także przy ocenie negatywnej warto rozmawiać o rozwoju i wskazać obszary do poprawy. Uzasadnienie negatywnej oceny jest obowiązkowe (§ 10 ust. 4)."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 6.5.1. Rozmowa oceniająca", strona: 26,
         cytat_dosłowny: "Pracownikowi należy dać możliwość wypowiedzenia się"}

  - id: FAQ-R07
    sciezka: wspolne
    pytania:
      - jak przeprowadzić rozmowę oceniającą krok po kroku
      - pierwszy raz prowadzę rozmowę oceniającą od czego zacząć
      - jak wygląda rozmowa oceniająca z pracownikiem
      - jak przeprowadzić rozmowę z pracownikiem
      - robię rozmowę pierwszy raz i nie wiem jak ją przeprowadzić
    odpowiedz: "Krok po kroku: (1) Przygotowanie: zbierz konkretne przykłady zachowań z całego okresu i przygotuj roboczą wersję oceny (przy pierwszej ocenie także na podstawie sprawozdania). (2) Termin: w ocenie okresowej przed sporządzeniem oceny na piśmie (§ 10), w pierwszej ocenie niezwłocznie po złożeniu sprawozdania (§ 8 ust. 1). (3) Przebieg: omów główne obowiązki i sposób ich realizacji wobec kryteriów, realizację celów oraz kierunki rozwoju; przy każdym kryterium pytaj o konkretne sytuacje. (4) Dialog: daj pracownikowi przedstawić własną ocenę i argumenty; rozmowa ma być dialogiem, a nie monologiem oceniającego. (5) Po rozmowie: uwzględnij jej wnioski w ocenie na piśmie i zapoznaj pracownika z oceną. W Kompasie przeprowadzi Cię przez to ekran „Rozmowa oceniająca”: kryterium po kryterium, z podpowiedziami pytań."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.4. Rozmowa oceniająca", strona: 25,
         cytat_dosłowny: "nie była monologiem oceniającego, lecz dialogiem oceniającego z ocenianym"}
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.3. Proces oceniania", strona: 24,
         cytat_dosłowny: "ustalenie comiesięcznych lub cokwartalnych rozmów"}
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-pierwsza, lokalizator: "rozdz. 6.5.1. Rozmowa oceniająca", strona: 27,
         cytat_dosłowny: "powinien przygotować roboczą wersję oceny pracownika"}
      - {kategoria: PRZEPIS, doc_id: rozp-2016-okresowe, lokalizator: "§ 10", strona: 3,
         cytat_dosłowny: "przeprowadza z ocenianym rozmowę oceniającą"}
      - {kategoria: PRZEPIS, doc_id: rozp-2015-pierwsza, lokalizator: "§ 8 ust. 1", strona: 3,
         cytat_dosłowny: "przeprowadza z ocenianym rozmowę oceniającą niezwłocznie po złożeniu sprawozdania"}

  - id: FAQ-R06
    sciezka: wspolne
    pytania:
      - jak dokumentować pracę pracownika przez cały okres oceny
      - notatki o pracowniku w trakcie roku
      - jak uniknąć oceniania tylko na podstawie ostatnich tygodni
    odpowiedz: "Zbieraj informacje przez cały okres, na bieżąco i na piśmie: comiesięczne lub cokwartalne rozmowy podsumowujące, regularne podsumowania sukcesów i porażek, notatki z konkretnymi zdarzeniami. Dzięki temu ocena obejmuje cały okres, a nie tylko ostatnio zapamiętane działania."
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: poradnik-okresowa, lokalizator: "rozdz. 6.2.3. Proces oceniania", strona: 24,
         cytat_dosłowny: "ustalenie comiesięcznych lub cokwartalnych rozmów"}
